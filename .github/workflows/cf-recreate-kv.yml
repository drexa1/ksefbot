name: Clear ksefbot-whatsapp KV

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  KV_NAMESPACE_ID: KSEFBOT_WHATSAPP

jobs:
  recreate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clear ksefbot-whatsapp KV
        run: |
          set -euo pipefail
          cursor=""
          while true; do
            if [ -n "$cursor" ]; then
              response=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$KV_NAMESPACE_ID/keys?cursor=$cursor" -H "Authorization: Bearer $CF_API_TOKEN")
            else
              response=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$KV_NAMESPACE_ID/keys" -H "Authorization: Bearer $CF_API_TOKEN")
            fi
            keys=$(echo "$response" | jq '[.result[] | .name]')
            count=$(echo "$keys" | jq 'length')
            if [ "$count" -eq 0 ]; then
              break
            fi
            echo "Deleting $count KV keys..."
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$KV_NAMESPACE_ID/bulk/delete" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$keys"
            cursor=$(echo "$response" | jq -r '.result_info.cursor // empty')
            if [ -z "$cursor" ]; then
              break
            fi
          done