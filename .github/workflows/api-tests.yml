name: Weekly API tests smoke

on:
  schedule:
    - cron: "0 12 * * 6"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ENVIRONMENT: dev
  TEST_MODE: true
  API_KEY: ${{ secrets.API_KEY }}
  CEIDG_API_KEY: ${{ secrets.CEIDG_API_KEY }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Create CI .dev.vars
        run: |
          printf '%s\n' "ENVIRONMENT=dev" "TEST_MODE=true" "API_KEY=${API_KEY}" "CEIDG_API_KEY=${CEIDG_API_KEY}" > .dev.vars
      - name: Run API collections
        run: npm run api:ci:tests