name: Build CLI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '.github/**'
      - 'db/**'
      - 'pages/**'
      - 'public/**'
      - 'src/**'
      - 'tests/**'
      - '../../worker-api/**'
      - '../../worker-whatsapp/**'
      - '.gitignore'
      - 'BACKLOG.md'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'tsconfig.json'
      - 'vite.config.js'
      - '../../wrangler.worker-ksef.toml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  BINARY_NAME: ksefbot

jobs:

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ""

          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            extension: ""

          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            extension: ""

          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: ".exe"

    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}${{ matrix.extension }}" \
             "dist/${BINARY_NAME}-${{ matrix.target }}${{ matrix.extension }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: dist/${{ env.BINARY_NAME }}-${{ matrix.target }}${{ matrix.extension }}

  release:
    name: Publish latest release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: ${{ env.BINARY_NAME }}-*
          merge-multiple: true
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest --title "Latest" --prerelease dist/*
