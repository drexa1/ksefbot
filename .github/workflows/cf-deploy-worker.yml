name: Deploy Cloudflare worker

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ENVIRONMENT: dev
  TEST_MODE: true
  API_KEY: ${{ secrets.API_KEY }}
  CEIDG_API_KEY: ${{ secrets.CEIDG_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Create CI .dev.vars
        run: |
          echo "ENVIRONMENT=dev"                >> .dev.vars
          echo "TEST_MODE=true"                 >> .dev.vars
          echo "API_KEY=${API_KEY}"             >> .dev.vars
          echo "CEIDG_API_KEY=${CEIDG_API_KEY}" >> .dev.vars
      - name: Run API collections
        run: npm run api:ci:tests
      - name: Deploy worker
        run: npm run worker-api:prod:deploy
