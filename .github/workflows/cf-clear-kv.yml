name: Clear Cloudflare messages KV

on:
  workflow_dispatch:
    # Phone provided + checkbox unchecked → delete that phone's messages
    # Phone provided + checkbox checked → delete that phone's messages
    # Phone empty + checkbox checked → delete everything
    # Phone empty + checkbox unchecked → stop without deleting anything
    inputs:
      phone:
        description: 'User to clear messages. Empty to clear all messages.'
        required: false
        type: string
        default: '48518121343'
      confirm:
        description: '⚠️ Delete all'
        required: true
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  KV_NAMESPACE: '6eef7c9dcdbb420ca0d747a243156bc3'

jobs:
  clear:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clear ksefbot-whatsapp KV
        env:
          PHONE: ${{ inputs.phone }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          if [ -n "$PHONE" ]; then
            prefix="in::${PHONE}::"
          elif [ "$CONFIRM" = "true" ]; then
            prefix=""
          else
            echo "Phone is empty and 'Delete all' is not checked."
            exit 1
          fi

          while true; do
            url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$KV_NAMESPACE/keys"

            if [ -n "$prefix" ]; then
              url="$url?prefix=$(printf '%s' "$prefix" | jq -sRr @uri)"
            fi

            response=$(curl -fsS "$url" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

            keys=$(echo "$response" | jq '[.result[] | .name]')
            count=$(echo "$keys" | jq 'length')

            if [ "$count" -eq 0 ]; then
              break
            fi

            curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$KV_NAMESPACE/bulk/delete" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$keys"
          done