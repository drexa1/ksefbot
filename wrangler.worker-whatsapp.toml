name = "ksefbot-whatsapp"
main = "worker-whatsapp/worker.ts"
compatibility_date = "2026-01-01"

[vars]
ENVIRONMENT = "cloudflare"
META_API_VERSION = "v26.0"
WHATSAPP_PHONE_ID = "1212895211918077"

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[[services]]
binding = "KSEFBOT"
service = "ksefbot"

[[d1_databases]]
binding = "D1"
database_name = "ksef-bot"
database_id = "101428e1-3e1c-479b-a71b-374c1ee24412"
remote = true

[[kv_namespaces]]
binding="KV"
id="6eef7c9dcdbb420ca0d747a243156bc3"